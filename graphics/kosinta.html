<html>
<head>
  <title>Kosinta-apuri - Romantic Graphic</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Basic Reset */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent !important; /* REQUIRED: Transparent background */
    }

    /* Graphic Container - 1920x1080 Resolution */
    .graphic-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px; /* HD Width */
      height: 1080px; /* HD Height */
      overflow: hidden;
      display: grid; /* Use grid for layered content */
      grid-template-areas: "content";
      place-items: center; /* Center everything in the grid */
      perspective: 1000px; /* For 3D effects */
      background: radial-gradient(circle at center, #ffe4e1 0%, #ffb6c1 100%); /* Soft romantic gradient */
      animation: gradientShift 15s ease infinite alternate; /* Gentle background animation */
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Layering content using grid-area */
    .background-elements,
    .particle-container,
    .title-area,
    .noise-overlay {
      grid-area: content;
      width: 100%;
      height: 100%;
      position: relative; /* Position relative to the grid area */
      display: flex; /* Use flexbox for centering within the layer */
      justify-content: center;
      align-items: center;
    }

    /* Z-indexing for depth */
    .background-elements { z-index: 1; }
    .particle-container { z-index: 2; pointer-events: none; } /* Particles on top of background, non-interactive */
    .title-area { z-index: 3; } /* Title on top of particles */
    .noise-overlay { z-index: 4; pointer-events: none; } /* Noise layer on top, non-interactive */

    /* Background Glowing Blobs */
    .blob {
        position: absolute;
        width: 400px; /* Larger size */
        height: 400px;
        background: radial-gradient(circle, rgba(255, 105, 180, 0.4) 0%, rgba(255, 182, 193, 0) 70%); /* Pink glow */
        border-radius: 50%;
        filter: blur(100px); /* Heavy blur */
        animation: floatEffect 25s ease-in-out infinite alternate; /* Gentle float animation */
    }

    @keyframes floatEffect {
        0% { transform: translate(0, 0); }
        100% { transform: translate(var(--float-x, 50px), var(--float-y, 30px)); }
    }

    /* Particle System */
    .particle {
        position: absolute;
        width: 12px; /* Particle size */
        height: 12px;
        background-color: rgba(255, 182, 193, 0.9); /* Light pink */
        border-radius: 50%; /* Circle shape */
        filter: blur(2px); /* Subtle glow */
        opacity: 0; /* Start invisible */
        animation: particleMovement 15s ease-in-out infinite alternate both, subtlePulse 3s ease-in-out infinite alternate;
    }

     @keyframes particleMovement {
        0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
        10% { opacity: 0.8; } /* Fade in */
        90% { opacity: 0.8; } /* Stay visible */
        100% { transform: translate(var(--move-x, 50px), var(--move-y, -50px)) scale(1.2); opacity: 0; } /* Float and fade out */
    }

    @keyframes subtlePulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }


    /* Noise Overlay - Using SVG Filter */
    .noise-overlay {
      opacity: 0.04; /* Very subtle */
      filter: url(#noise); /* Apply SVG filter */
    }


    /* Title Styling */
    h1 {
      font-family: 'Playfair Display', serif; /* Elegant font */
      font-size: 140px; /* Large, prominent */
      color: #eedd82; /* Soft gold color */
      text-align: center;
      margin: 0;
      padding: 0 20px;
      text-shadow:
          0 0 15px rgba(255, 105, 180, 0.6), /* Pink glow 1 */
          0 0 30px rgba(255, 105, 180, 0.4), /* Pink glow 2 */
          5px 5px 20px rgba(0, 0, 0, 0.4); /* Soft shadow */
      letter-spacing: 3px; /* Increase spacing slightly */
      position: relative; /* For potential pseudo-elements or layering */
      transform: translateZ(80px); /* Push forward in 3D space */
      opacity: 0; /* Start invisible for animation */
      animation: textFadeIn 2s ease-out forwards 0.5s, titlePulse 6s ease-in-out infinite alternate; /* Fade in and gentle pulse */
    }

    @keyframes textFadeIn {
        to { opacity: 1; }
    }

    @keyframes titlePulse {
        0% { transform: scale(1) translateZ(80px); }
        100% { transform: scale(1.01) translateZ(80px); }
    }

    /* Fallback font */
    body {
        font-family: sans-serif;
    }
     h1 {
        font-family: 'Playfair Display', serif, sans-serif;
    }

  </style>
</head>
<body>

  <!-- SVG Filters for Noise -->
  <svg id="svg-filters" style="position: absolute; width: 0; height: 0;">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feComposite in="SourceGraphic" operator="atop"/>
    </filter>
  </svg>

  <div class="graphic-container">

    <div class="background-elements">
        <!-- Glowing blobs for atmosphere -->
        <div class="blob" style="top: 10%; left: 15%; --float-x: 50px; --float-y: 30px;"></div>
        <div class="blob" style="bottom: 10%; right: 15%; animation-delay: 5s; --float-x: -40px; --float-y: -20px;"></div>
         <div class="blob" style="top: 60%; left: 50%; animation-delay: 2s; --float-x: 10px; --float-y: -80px; width: 300px; height: 300px;"></div>
    </div>

    <div class="particle-container">
      <!-- Animated particles -->
      <div class="particle" style="top: 20%; left: 25%; animation-delay: 0s; --move-x: 50px; --move-y: -50px;"></div>
      <div class="particle" style="top: 40%; left: 80%; animation-delay: 2s; --move-x: -30px; --move-y: 80px;"></div>
      <div class="particle" style="top: 70%; left: 10%; animation-delay: 4s; --move-x: 100px; --move-y: 20px;"></div>
      <div class="particle" style="top: 10%; left: 60%; animation-delay: 6s; --move-x: -80px; --move-y: -30px;"></div>
      <div class="particle" style="top: 80%; left: 40%; animation-delay: 8s; --move-x: 20px; --move-y: 100px;"></div>
      <div class="particle" style="top: 30%; left: 50%; animation-delay: 10s; --move-x: -50px; --move-y: -70px;"></div>
      <div class="particle" style="top: 60%; left: 70%; animation-delay: 12s; --move-x: 70px; --move-y: -20px;"></div>
      <div class="particle" style="top: 50%; left: 20%; animation-delay: 1s; --move-x: -20px; --move-y: 60px;"></div>
      <div class="particle" style="top: 30%; left: 90%; animation-delay: 3s; --move-x: 60px; --move-y: -40px;"></div>
       <div class="particle" style="top: 90%; left: 60%; animation-delay: 7s; --move-x: -40px; --move-y: -90px;"></div>
    </div>

    <div class="title-area">
      <!-- Main Title - Editable -->
      <h1>Kosinta-apuri</h1>
    </div>

     <div class="noise-overlay"></div>

  </div>

  <!-- No specific JavaScript required for these CSS animations -->

</body>
</html>
