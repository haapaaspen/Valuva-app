<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Graphic</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent !important;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .graphic-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .lower-third {
      width: 80%;
      max-width: 1000px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(110, 142, 251, 0.9), rgba(167, 119, 227, 0.9));
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      color: white;
      font-family: 'Arial', sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    .lower-third::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    
    h1 {
      font-size: 48px;
      margin: 0 0 10px 0;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1.2;
    }
    
    p {
      font-size: 24px;
      margin: 0;
      opacity: 0.9;
      line-height: 1.4;
    }
    
    .accent-bar {
      height: 6px;
      width: 120px;
      background-color: #ffcc00;
      margin-bottom: 10px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="graphic-container">
    <div class="lower-third">
      <div class="accent-bar"></div>
      <h1>Valuva AI Graphics</h1>
      <p>HTML-based graphics for DaVinci Resolve</p>
    </div>
  </div>
  
  <script>
    // Add a simple animation effect
    document.addEventListener('DOMContentLoaded', () => {
      const h1 = document.querySelector('h1');
      h1.style.opacity = '0';
      h1.style.transform = 'translateY(20px)';
      h1.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      
      const p = document.querySelector('p');
      p.style.opacity = '0';
      p.style.transform = 'translateY(20px)';
      p.style.transition = 'opacity 0.5s ease 0.2s, transform 0.5s ease 0.2s';
      
      setTimeout(() => {
        h1.style.opacity = '1';
        h1.style.transform = 'translateY(0)';
        
        setTimeout(() => {
          p.style.opacity = '0.9';
          p.style.transform = 'translateY(0)';
        }, 200);
      }, 100);
    });
  </script>
</body>
</html>
