<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuva Graphic - Bubbly 3D Wax (Rounded Font)</title>
    <style>
        /* Embed Quicksand font (rounded edges) */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');

        /* Ensure full viewport coverage and transparency */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
            background-color: transparent !important;
            font-family: 'Quicksand', sans-serif; /* Default font */
            color: #ffffff; /* Default text color */
        }

        .graphic-container {
            position: relative;
            width: 1920px; /* Standard HD width */
            height: 1080px; /* Standard HD height */
            overflow: hidden; /* Clip elements outside this container */
            background-color: transparent !important;
             position: absolute;
             top: 0;
             left: 0;
        }

        /* --- Graphic Elements: Bubbly, Organic, Flowy Shapes --- */

        .organic-shape {
            position: absolute;
            overflow: hidden; /* Hide gradient overflow */
             filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.4)) drop-shadow(0 8px 15px rgba(0, 0, 0, 0.25)); /* Enhanced shadow */
        }

        /* Shape 1: Pastel Pink */
        .organic-shape.pink {
            width: 900px;
            height: 1000px;
            top: -100px;
            left: -200px;
            border-radius: 45% 55% 60% 40% / 50% 50% 35% 65%; /* Organic shape */
            background: linear-gradient(135deg, #f7b2bd 0%, #e08a96 50%, #c9616f 100%);
            z-index: 2;
            transform: rotate(-8deg);
        }

        /* Shape 2: Pastel Blue */
        .organic-shape.blue {
            width: 800px;
            height: 850px;
            top: 50px;
            left: 700px;
            border-radius: 60% 40% 50% 50% / 55% 45% 60% 40%; /* Organic shape */
            background: linear-gradient(135deg, #b2c2f7 0%, #8a9ae0 50%, #6172c9 100%);
            z-index: 3;
            transform: rotate(5deg);
        }

         /* Shape 3: Pastel Green */
        .organic-shape.green {
            width: 700px;
            height: 750px;
            top: 300px;
            left: 1200px;
            border-radius: 50% 50% 70% 30% / 50% 50% 30% 70%; /* Organic shape */
            background: linear-gradient(135deg, #b2f7c2 0%, #8ae09a 50%, #61c972 100%);
            z-index: 4;
            transform: rotate(12deg);
        }

         /* Shape 4: Deeper background blend (optional, but adds depth) */
         .organic-shape.deep {
            width: 1200px;
            height: 1300px;
            top: -300px;
            left: 1000px;
            border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%; /* Organic shape */
            background: radial-gradient(circle at 50% 50%, rgba(200, 100, 80, 0.3) 0%, rgba(100, 50, 30, 0.5) 50%, rgba(50, 20, 10, 0.6) 100%);
            z-index: 1;
            transform: rotate(-15deg);
             filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6)); /* Stronger shadow for background */
        }


        /* Text Styling - Bubbly 3D Font Effect with Rounded Font */
        h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px; /* Very large for main title */
            font-family: 'Quicksand', sans-serif; /* Use the rounded font */
            font-weight: 700; /* Quicksand Bold */
            text-align: center;
            text-transform: uppercase;
            color: #fff5eb; /* Soft creamy white for text */
            letter-spacing: 5px; /* Slightly reduced letter spacing for Quicksand */
            z-index: 10; /* Ensure text is on top */
            white-space: nowrap; /* Prevent wrapping */

            /* Bubbly 3D Wax Effect via Text Shadow */
            text-shadow:
                /* Base layer - acts as the visible text face */
                0 3px 3px rgba(0,0,0,0.3), /* Slightly stronger base shadow */

                /* Layers simulating depth / thickness */
                0 6px 6px rgba(0,0,0,0.2),
                0 9px 9px rgba(0,0,0,0.15),
                0 12px 12px rgba(0,0,0,0.1),
                0 15px 15px rgba(0,0,0,0.08),
                0 18px 18px rgba(0,0,0,0.05),

                /* Deeper, colored shadows contributing to the wax/bubbly look & integrating with background */
                7px 7px 20px rgba(247, 178, 189, 0.7), /* Pastel Pink Shadow (slightly more spread) */
                -7px 7px 20px rgba(178, 194, 247, 0.7), /* Pastel Blue Shadow */
                7px -7px 20px rgba(178, 247, 194, 0.7), /* Pastel Green Shadow */
                -7px -7px 20px rgba(247, 178, 189, 0.7), /* Another Pink */

                /* General soft shadow for overall depth */
                0 25px 40px rgba(0,0,0,0.5); /* Stronger overall shadow */
        }

        /* Subtitle and smaller text (if used) */
        p, span {
             position: absolute;
             left: 50%;
             transform: translateX(-50%);
             font-family: 'Quicksand', sans-serif;
             text-align: center;
             color: rgba(255, 255, 255, 0.9);
             text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.3);
             z-index: 10;
             margin: 0; /* Remove default margin */
        }

         p {
            top: 65%; /* Position below title */
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
         }

         span {
             top: 70%; /* Example positioning */
             font-size: 24px;
             font-weight: 400;
         }


        /* Adding a subtle overall gradient overlay for atmosphere */
        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 220, 180, 0.1) 0%, rgba(150, 100, 80, 0.2) 50%, rgba(50, 20, 10, 0.3) 100%);
            z-index: 11; /* Above most elements but below text */
            pointer-events: none; /* Allow clicks/interactions to pass through */
        }

         /* Adding a subtle texture overlay */
         .texture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0gAAAAEklEQVQYV2OgpaXFwICAAAEGBgYDAD4ACIDZ26JmAAAAAElFTkVlCCRtAAAAAElFTkSuQmCC') repeat; /* Tiny 2x2 pixel noise */
            opacity: 0.07; /* Subtle grain */
            z-index: 12;
            pointer-events: none;
         }

    </style>
</head>
<body>
    <div class="graphic-container">
        <!-- Organic Flowing Shapes with Pastel Colors -->
        <div class="organic-shape deep"></div>
        <div class="organic-shape pink"></div>
        <div class="organic-shape blue"></div>
        <div class="organic-shape green"></div>

        <!-- Text Content with Bubbly 3D Effect and Rounded Font -->
        <h1>Wax with Friends</h1>
        <!-- Subtitle or smaller text can go here if needed -->
        <!-- <p>Example Subtitle</p> -->
        <!-- <span>Smaller detail text</span> -->

        <!-- Overlays for atmosphere and texture -->
        <div class="gradient-overlay"></div>
        <div class="texture-overlay"></div>

    </div>

    <script>
        // No JavaScript required as per the 'no animations' instruction.
        // This script block is included to adhere to the structure requirement
        // but remains empty.
    </script>
</body>
</html>
