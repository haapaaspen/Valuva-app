<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Intro Graphic</title>
    <style>
        /* Import Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Lora:wght@400;700&display=swap');

        /* Basic Reset and Body/HTML Styles for Overlay */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important; /* Essential for video overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lora', serif; /* Default font */
            position: relative;
        }

        .intro-container {
            width: 1920px; /* Standard HD width */
            height: 1080px; /* Standard HD height */
            position: relative;
            overflow: hidden;
            background-color: transparent; /* Ensure container is also transparent */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Background Layers (Maximalist Blue Hour Campfire Vibe) --- */

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Initial state for animation */
            opacity: 0;
            transform: scale(1.05);
            animation: backgroundFadeIn 2s ease-out forwards;
        }

        .layer-1 {
            /* Deep Blue Hour Gradient */
            background: linear-gradient(to bottom, #0b0f21 0%, #1a2a4a 50%, #3e5a8a 100%);
            animation-delay: 0.2s;
        }

        .layer-2 {
            /* Abstract Mountain/Tree Silhouette */
            background: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyMCIgaGVpZ2h0PSIxMDgwIiB2aWV3Qm94PSIwIDAgMTkyMCAxMDgwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cGF0aCBkPSJNMCAxMDgwVjcyNUw2NzMgNDMyTDEwMTcgNTM2TDE1OTQgMTcxTDE5MjAgNDMyVjEwODBIMCIgZmlsbD0iIzA4MTQyNyIvPgo8cGF0aCBkPSJNMCAxMDgwVjgzOEw1NDYgNTM2TDEwMTcgNjA3TDE1OTQgMzA4TDE5MjAgNDMyVjEwODBIMCIgZmlsbD0iIzA1MDkxNiIvPgo8L3N2Zz4=') no-repeat bottom center / cover;
            background-size: 1920px auto; /* Adjusted size for better fit */
             background-position: bottom center;
            opacity: 0.5; /* Start with some opacity */
            animation-delay: 0.5s;
        }

         .layer-3 {
            /* Subtle Stars/Texture Overlay */
            background: radial-gradient(ellipse at bottom, rgba(255, 165, 0, 0.1) 0%, transparent 60%), /* Subtle warm glow area */
                        url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAEAQMAAABOgn9AAAAABlBMVEUAAAD////Dyq4uAAAAAXRSTlMAQObYZgAAABB0Uk5TAAhfL6C/gGDwwGCwoP/fH9iLAAAACklEQVQIHWPwAgMD/x8YGPw/MDDw/w/CwsDA/z8MDAwP/z8AAQAEWbQO8T9g7AAAAABJRU5ErkJggg=='); /* Subtle noise/star pattern */
             background-size: cover, 4px 4px;
            opacity: 0.3; /* Subtle opacity */
            animation: backgroundFadeIn 2s ease-out forwards, starTwinkle 5s infinite alternate ease-in-out; /* Add twinkle */
            animation-delay: 0.8s;
            filter: blur(0.5px); /* Soften the noise */
        }

        @keyframes backgroundFadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* --- Fire Glow Effect --- */
         .fire-glow-container {
            position: absolute;
            bottom: -200px; /* Position below the screen */
            left: 50%;
            transform: translateX(-50%);
            width: 1000px; /* Large glow area */
            height: 800px;
            background: radial-gradient(ellipse at center, rgba(255, 140, 0, 0.5) 0%, rgba(255, 69, 0, 0.3) 30%, rgba(255, 0, 0, 0.1) 60%, transparent 80%);
            filter: blur(100px);
            z-index: 1; /* Below text */
            opacity: 0;
            animation: fireGlowPulse 4s infinite ease-in-out, fireGlowFadeIn 2s ease-out forwards;
            animation-delay: 1.5s;
        }

        @keyframes fireGlowPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            50% { transform: translateX(-50%) scale(1.05); opacity: 1; }
        }

         @keyframes fireGlowFadeIn {
            to {
                opacity: 0.8;
            }
        }


        /* --- Text Styling (Maximalist & Cinematic) --- */

        .text-container {
            position: relative;
            z-index: 10; /* Above backgrounds and glow */
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Subtle text shadow */
            opacity: 0;
            animation: textFadeInScale 2s ease-out forwards;
             animation-delay: 2.5s; /* Wait for background to settle */
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-size: 120px;
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            /* Maximalist text effect */
            text-shadow:
                0 0 10px rgba(255, 100, 0, 0.5), /* Subtle outer glow */
                0 0 20px rgba(255, 50, 0, 0.3), /* More glow */
                0 0 30px rgba(255, 0, 0, 0.1),  /* Even more glow */
                2px 2px 5px rgba(0, 0, 0, 0.6); /* Hard shadow for depth */
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.1); /* Subtle stroke */
        }

        .title br {
            display: block; /* Ensure line break */
            margin-bottom: 10px; /* Add space between lines */
        }


         @keyframes textFadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

         /* --- Foreground Details (Maximalist) --- */
         .foreground-detail {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             pointer-events: none; /* Allow clicking through */
             z-index: 20; /* Above text */
             /* Subtle vignette or pattern */
             box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
             opacity: 0;
             animation: detailFadeIn 2s ease-out forwards;
             animation-delay: 3s; /* Fade in last */
         }

        @keyframes detailFadeIn {
            to {
                opacity: 1;
            }
        }


        /* Optional: Subtle Ember-like Particles (CSS only - simplified) */
        /* This is a complex effect to do well with CSS only. A simple version is shown here */
        /* Or consider a JS particle system for a more robust effect */
        .ember {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 4px;
            background-color: #ffaa00; /* Orange */
            border-radius: 50%;
            filter: blur(1px);
            z-index: 5; /* Above background, below text */
            opacity: 0;
            pointer-events: none;
            animation: floatEmber 5s infinite ease-out;
        }

        /* Create multiple embers with different delays and positions */
        .ember:nth-child(1) { left: calc(50% - 200px); animation-delay: 0.5s; animation-duration: 6s; }
        .ember:nth-child(2) { left: calc(50% + 150px); animation-delay: 1.2s; animation-duration: 5.5s; }
        .ember:nth-child(3) { left: calc(50% - 100px); animation-delay: 2s; animation-duration: 7s; }
        .ember:nth-child(4) { left: calc(50% + 50px); animation-delay: 2.8s; animation-duration: 6.5s; }
        .ember:nth-child(5) { left: calc(50% - 300px); animation-delay: 3.5s; animation-duration: 5s; }
        .ember:nth-child(6) { left: calc(50% + 250px); animation-delay: 4.2s; animation-duration: 7.5s; }


        @keyframes floatEmber {
            0% {
                transform: translate(-50%, 0) scale(1);
                opacity: 0;
            }
            20% {
                 opacity: 0.6;
            }
             80% {
                opacity: 0.3;
             }
            100% {
                transform: translate(calc(-50% + (random() - 0.5) * 100px), -800px) scale(0.5); /* Float up and drift */
                opacity: 0;
            }
        }

        /* Helper function for random values in CSS (Limited support, consider JS) */
        /* @property --rand { syntax: '<number>'; initial-value: 0; inherits: false; } */
        /* @keyframes randomTranslate { to { --rand: 1; } } */
        /* transform: translate(calc(-50% + (var(--rand) - 0.5) * 100px), -800px) ... (Does not work directly in keyframes like this) */
        /* Using specific values for embers is simpler for this example */


    </style>
</head>
<body>

    <div class="intro-container">
        <div class="background-layer layer-1"></div>
        <div class="background-layer layer-2"></div>
        <div class="background-layer layer-3"></div>

        <div class="fire-glow-container"></div>

        <div class="text-container">
            <h1 class="title">Making a film<br>in 48 hours</h1>
        </div>

        <!-- Simple CSS Embers (optional, add more if needed) -->
        <div class="ember"></div>
        <div class="ember"></div>
        <div class="ember"></div>
        <div class="ember"></div>
        <div class="ember"></div>
        <div class="ember"></div>


        <div class="foreground-detail"></div>
    </div>

    <script>
        // No JavaScript needed for this purely CSS animated graphic.
        // If complex particle systems or sequenced animations were required, JS would be used here.
        // For example:
        /*
        document.addEventListener('DOMContentLoaded', () => {
            // Can add classes to trigger animations after load if needed
            const container = document.querySelector('.intro-container');
            container.classList.add('is-loaded'); // CSS would then use .is-loaded classes
        });
        */
    </script>

</body>
</html>
