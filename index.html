<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valuva AI Graphics</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo">Valuva AI Graphics</div>
    <div id="connection-status" class="status">Connecting to Resolve...</div>
  </header>
  
  <main>
    <div class="sidebar">
      <div class="section">
        <button id="select-file-btn"><i class="fas fa-file-import"></i> Select HTML File</button>
        <div id="file-info" class="hidden">
          <div class="section-title"><i class="fas fa-file-code icon"></i> Selected File</div>
          <div id="file-path"></div>
        </div>
      </div>
      
      <div id="parameters-section" class="section hidden">
        <div class="section-title"><i class="fas fa-font icon"></i> Text Elements</div>
        <div id="text-parameters"></div>
        
        <div class="section-title"><i class="fas fa-paint-brush icon"></i> Character</div>
        <div id="character-parameters" class="parameter-group">
          <!-- Font family, size, etc. will be dynamically generated -->
        </div>
        
        <div class="section-title"><i class="fas fa-align-left icon"></i> Paragraph</div>
        <div id="paragraph-parameters" class="parameter-group">
          <!-- Alignment, spacing, etc. will be dynamically generated -->
        </div>
        
        <div class="section-title"><i class="fas fa-palette icon"></i> Appearance</div>
        <div id="style-parameters"></div>
        
        <div class="section-title"><i class="fas fa-sliders-h icon"></i> Effects</div>
        <div id="effects-parameters" class="parameter-group">
          <!-- Effects controls will be dynamically generated -->
        </div>
        
        <div class="action-buttons">
          <button id="export-btn"><i class="fas fa-file-export"></i> Export to Timeline</button>
        </div>
      </div>
    </div>
    
    <div class="content-area">
      <div class="preview-container">
        <div class="preview-toolbar">
          <div><i class="fas fa-eye"></i> Preview</div>
          <div class="preview-dimension">1920×1080</div>
        </div>
        
        <div class="preview-aspect-container">
          <div id="no-preview" class="no-preview">
            <div>
              <i class="fas fa-file-image fa-3x"></i><br>
              Select an HTML file to preview
            </div>
          </div>
          
          <div class="aspect-ratio-box">
            <iframe id="preview-frame" class="preview-frame hidden" sandbox="allow-scripts allow-same-origin"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="renderer.js"></script>
</body>
</html>
