<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaVinci Resolve Connection Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    header {
      background-color: #333;
      color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .status-container {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .connection-status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 15px;
      font-weight: bold;
    }
    .connected {
      background-color: #4CAF50;
      color: white;
    }
    .disconnected {
      background-color: #f44336;
      color: white;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    #resolveInfo {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>DaVinci Resolve Connection Tester</h1>
    </header>
    
    <div class="status-container">
      <h2>Connection Status</h2>
      <p>Current status: <span id="connectionStatus" class="connection-status disconnected">Checking...</span></p>
      <button id="checkConnection">Check Connection</button>
    </div>
    
    <div id="resolveInfo">
      <p>Waiting for connection to DaVinci Resolve...</p>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
