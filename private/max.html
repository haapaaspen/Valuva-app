<!DOCTYPE html>
<html>
<head>
    <title>Futuristic AI Project Graphic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Ensure body and html are transparent for video overlay */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px; /* Target resolution width */
            height: 1080px; /* Target resolution height */
            overflow: hidden; /* Hide scrollbars */
            background-color: transparent !important; /* Absolutely critical for video overlay */
            font-family: 'Orbitron', sans-serif; /* Futuristic font, with fallback */
            color: #E0FFFF; /* Light cyan color */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .graphic-container {
            position: relative;
            width: 100%; /* Occupy full body width */
            height: 100%; /* Occupy full body height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(0, 10, 30, 0.8) 0%, rgba(0, 0, 10, 0.9) 50%, rgba(0, 0, 0, 1) 100%); /* Subtle dark background gradient */
            overflow: hidden; /* Contain pseudo-elements */
        }

        /* Adding some subtle futuristic background elements */
        .graphic-container::before,
        .graphic-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .graphic-container::before {
            width: 800px;
            height: 800px;
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, #00FFFF, transparent 60%); /* Cyan glow */
            animation: glow-pulse 8s ease-in-out infinite alternate;
        }

        .graphic-container::after {
            width: 600px;
            height: 600px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, #00BFFF, transparent 60%); /* Deep sky blue glow */
            animation: glow-pulse 7s ease-in-out infinite alternate-reverse;
        }

        h1 {
            font-size: 96px; /* Large title */
            font-weight: 700;
            color: #E0FFFF; /* Light cyan */
            text-transform: uppercase;
            letter-spacing: 8px;
            margin: 0;
            padding: 20px 40px;
            position: relative;
            z-index: 10; /* Ensure text is above background effects */
            text-shadow:
                0 0 10px #00FFFF, /* Subtle glow */
                0 0 20px #00FFFF,
                0 0 30px #00BFFF, /* Deeper glow layer */
                0 0 40px #00BFFF,
                0 0 60px #0077FF; /* Stronger glow layer */
            animation: text-glow 3s ease-in-out infinite alternate;
        }

        /* Subtle animation keyframes */
        @keyframes glow-pulse {
            0% {
                transform: scale(1);
                opacity: 0.4;
            }
            100% {
                transform: scale(1.05);
                opacity: 0.6;
            }
        }

        @keyframes text-glow {
            0% {
                text-shadow:
                    0 0 10px #00FFFF,
                    0 0 20px #00FFFF,
                    0 0 30px #00BFFF,
                    0 0 40px #00BFFF,
                    0 0 60px #0077FF;
            }
            100% {
                 text-shadow:
                    0 0 12px #00FFFF,
                    0 0 25px #00FFFF,
                    0 0 35px #00BFFF,
                    0 0 45px #00BFFF,
                    0 0 70px #0077FF,
                    0 0 80px #0077FF; /* Enhance glow slightly */
            }
        }

        /* Optional: Add a subtle entry animation */
        .graphic-container h1 {
             opacity: 0;
             transform: translateY(20px);
             animation: slide-fade-in 1.5s ease-out forwards;
        }

        @keyframes slide-fade-in {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Adding some layered geometric elements (non-text) for depth */
        .graphic-container::before,
        .graphic-container::after {
             /* Existing styles */
        }

        /* Example of a subtle, non-editable visual element */
        .futuristic-line {
            position: absolute;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #00BFFF 50%, transparent 100%);
            bottom: 150px;
            left: 10%;
            opacity: 0.3;
            z-index: 5;
            animation: line-pulse 5s ease-in-out infinite;
        }

         .futuristic-line::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, #E0FFFF 50%, transparent 100%);
            top: -5px;
            opacity: 0.5;
         }

        @keyframes line-pulse {
            0% { transform: scaleX(1); opacity: 0.3; }
            50% { transform: scaleX(1.01); opacity: 0.4; }
            100% { transform: scaleX(1); opacity: 0.3; }
        }

    </style>
</head>
<body>
    <div class="graphic-container">
        <!-- Text content must be in semantic tags -->
        <h1>max's AI project</h1>

        <!-- Non-editable visual elements can be added here -->
        <div class="futuristic-line"></div>

    </div>

</body>
</html>
