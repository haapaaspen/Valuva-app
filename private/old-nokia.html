<!DOCTYPE html>
<html>
<head>
    <title>Old Nokia - Title Graphic</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Ensure transparent background for video overlay */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent !important;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif; /* Primary font with fallback */
            color: #fff; /* Default text color */
        }

        .graphic-container {
            position: relative;
            width: 1920px; /* Standard HD width */
            height: 1080px; /* Standard HD height */
            overflow: hidden; /* Clip any elements exceeding the container */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
            box-sizing: border-box; /* Include padding/border in element's total width and height */
            /* Add subtle background effects for atmosphere */
            background: radial-gradient(circle at center, rgba(29, 41, 56, 0.3) 0%, rgba(17, 25, 35, 0.8) 80%, rgba(17, 25, 35, 0.95) 100%);
            opacity: 0; /* Start hidden for animation */
            animation: fadeInContainer 1.5s ease-out forwards;
        }

        /* Add a subtle noise/grain overlay for texture */
        .graphic-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Using a subtle noise data URL */
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAAA3NCSVQICAjb4U/gAAAACXBIWXMAAABlAAAAZQBjN5dDAAAABGdBTUEAALGctR9AAADcUExRVChMbxERD3Fxen9/f5GRkfr6+uvr6+fn5/T09Obm5tvb2+jo6PDw8N/f39TU1Nra2uDg4NTU1M/Pz+vr6+zs7M7OzpWVleXl5b+/v9zc3Pj4+Lq6uuzs7Pb29uDg4NXV1d/f39PT0+bm5tnZ2dDQ0OLi4uTk5Onp6c/Pz9LS0t3d3eDg4Nvb29XV1eXl5ejo6M/Pz+zs7Ojo6Nra2ubm5uXl5ejo6Ozs7N/f39DQ0OLi4uXl5c/Pz9LS0s7OzpCQkKysrObm5uTk5PX19dHR0ejo6PLy8vPz8+Dg4N/f39vb2+bm5uTk5OTk5OPj4+bm5uXl5ejo6OLi4uDg4M/Pz9DQ0Nvb2+fn59PT0+Xl5c3Nzejo6NfX1+Xl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX19vb2+jo6Obm5uXl5c3NzeXl5c/Pz9PT0+jo6Nvb2+Dg4NfX1+jo6P///wXW4jQAAAAUdFJOUwAHAggJDA0PERQYHSUnLzAxMzY4Ojs9P0BF/QGvAAAAAWJLR0T/apnPZwAAAEZJREFUKM9jgALiYGLm6OnpGRgYWIAAy8dPmJkA5K9kYGJkYmVgoGwChK/fwMEpLi4eBAXFJRgmJgamBgZAOdwlBAK1pSUDANmGCoJ7m7j6AAAAAElFTkSuQmCC');
            opacity: 0.1; /* Subtle opacity */
            pointer-events: none; /* Allow clicks/interaction with elements below */
            z-index: 1; /* Ensure it's above the background but below text */
        }

        .main-title {
            font-size: 150px; /* Large, dominant title */
            font-weight: 700; /* Bold */
            text-transform: uppercase; /* Classic title style */
            letter-spacing: 10px; /* Spaced out for grandeur */
            position: relative;
            margin: 0;
            padding: 20px 40px;
            z-index: 10; /* Ensure it's above background effects */
            line-height: 1; /* Tighten line height */

            /* Sophisticated text styling */
            background: linear-gradient(180deg, #ffcc66 0%, #ffa500 50%, #ffcc66 100%); /* Warm, nostalgic gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            /* Multiple text shadows for depth and subtle glow */
            text-shadow:
                0 0 5px rgba(255, 165, 0, 0.4), /* Subtle orange glow */
                0 0 10px rgba(255, 165, 0, 0.3),
                0 5px 10px rgba(0, 0, 0, 0.5), /* Standard shadow for depth */
                0 10px 20px rgba(0, 0, 0, 0.3); /* Deeper shadow */

            /* Optional: Subtle glow effect using ::before/::after */
            /* For this design, text-shadow handles glow well, but could add more layers */

            /* Animation */
            transform: scale(1.1); /* Start slightly larger */
            opacity: 0; /* Start invisible */
            animation:
                scaleIn 2s cubic-bezier(0.23, 1, 0.32, 1) forwards, /* Ease-out scale */
                fadeInText 1.5s ease-out 0.5s forwards; /* Delayed fade-in */
        }

        /* Keyframe Animations */
        @keyframes fadeInContainer {
            to { opacity: 1; }
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            to { transform: scale(1); }
        }

        /* Optional: Add a subtle pulsing effect on the glow */
        /*
        @keyframes pulseGlow {
            0% { text-shadow: ... previous shadows ..., 0 0 5px rgba(255, 165, 0, 0.4); }
            50% { text-shadow: ... previous shadows ..., 0 0 15px rgba(255, 165, 0, 0.6); }
            100% { text-shadow: ... previous shadows ..., 0 0 5px rgba(255, 165, 0, 0.4); }
        }
        .main-title { animation: ... , pulseGlow 3s ease-in-out infinite alternate; }
        */

    </style>
</head>
<body>
    <div class="graphic-container">
        <h1 class="main-title">Old Nokia</h1>
        <!-- All content must be inside this container -->
    </div>
</body>
</html>
